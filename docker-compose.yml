services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tangata
      POSTGRES_PASSWORD: tangata
      POSTGRES_DB: tangata
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tangata"]
      interval: 5s
      retries: 10

volumes:
  db-data:
